<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Sudoku</title>
<meta name="theme-color" content="#14161a" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-title" content="Juegos" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<script>
  (function () {
    try {
      var t = localStorage.getItem('sudoku_theme_v1');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <div class="toolbar">
    <select id="difficulty">
      <option value="easy">Fácil</option>
      <option value="medium" selected>Medio</option>
      <option value="hard">Difícil</option>
      <option value="expert">Experto</option>
    </select>
    <button class="btn" id="btn-new">Nueva partida</button>
    <button class="icon-btn" id="btn-undo" title="Deshacer">↺</button>
    <button class="icon-btn" id="btn-redo" title="Rehacer">↻</button>
    <button class="icon-btn" id="btn-check" title="Comprobar los números escritos">✓</button>
    <button class="icon-btn" id="btn-autonotes" title="Autocompletar anotaciones: calcula los candidatos posibles en cada celda vacía">✨</button>
  </div>

  <div class="statusbar">
    <a class="icon-btn back-btn" href="index.html" title="Volver a los juegos">←</a>
    <div class="timer" id="timer">00:00</div>
    <button class="icon-btn" id="btn-pause" title="Pausar">⏸</button>
    <button class="icon-btn" id="btn-theme" title="Cambiar esquema de colores">🌙</button>
  </div>

  <div class="palette" id="palette">
    <button class="swatch swatch-none" data-color="" title="Quitar color">∅</button>
    <button class="swatch" data-color="red" title="Rojo"></button>
    <button class="swatch" data-color="orange" title="Naranjo"></button>
    <button class="swatch" data-color="yellow" title="Amarillo"></button>
    <button class="swatch" data-color="green" title="Verde"></button>
    <button class="swatch" data-color="blue" title="Azul"></button>
    <button class="swatch" data-color="purple" title="Morado"></button>
    <button class="icon-btn" id="btn-clear-colors" title="Quitar todos los colores del tablero">🧹</button>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="pause-overlay" id="pause-overlay">
      <button class="btn" id="btn-resume">▶ Reanudar</button>
    </div>
    <div class="win-overlay hidden" id="win-overlay">
      <div class="win-card">
        <div class="win-icon">🏆</div>
        <h2>¡Resuelto!</h2>
        <div class="win-stats">
          <span class="win-chip" id="win-difficulty"></span>
          <span class="win-chip" id="win-time"></span>
        </div>
        <button class="btn win-btn" id="btn-win-new">Nueva partida</button>
      </div>
    </div>
  </div>

  <div class="numpad" id="numpad">
    <button class="num-btn" data-num="1">1<sup class="num-badge"></sup></button>
    <button class="num-btn" data-num="2">2<sup class="num-badge"></sup></button>
    <button class="num-btn" data-num="3">3<sup class="num-badge"></sup></button>
    <button class="num-btn" data-num="4">4<sup class="num-badge"></sup></button>
    <button class="num-btn" data-num="5">5<sup class="num-badge"></sup></button>
    <button class="num-btn" data-num="6">6<sup class="num-badge"></sup></button>
    <button class="num-btn" data-num="7">7<sup class="num-badge"></sup></button>
    <button class="num-btn" data-num="8">8<sup class="num-badge"></sup></button>
    <button class="num-btn" data-num="9">9<sup class="num-badge"></sup></button>
    <button class="num-btn erase" data-num="0" title="Borrar">⌫</button>
    <button class="num-btn tool-btn" id="btn-notes" title="Modo notas: anota candidatos en vez de escribir el número (N)">🔢</button>
    <button class="num-btn tool-btn" id="btn-digitfirst" title="Dígito primero: arma un número o color y luego toca/arrastra por las celdas (D)">👆</button>
  </div>

  <p class="hint" id="hint">
    <strong>Celda primero:</strong> celda → número/color. <strong>Dígito primero:</strong> arma → toca celdas.
  </p>

</div>

<script src="sudoku.js"></script>
<script src="app.js"></script>
<script src="pwa.js"></script>
</body>
</html>
