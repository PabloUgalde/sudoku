<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Juegos</title>
<meta name="theme-color" content="#14161a" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-title" content="Juegos" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<script>
  (function () {
    try {
      var t = localStorage.getItem('sudoku_theme_v1');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app home">

  <div class="statusbar">
    <h1 class="home-title">Elige un juego</h1>
    <button class="icon-btn" id="btn-theme" title="Cambiar esquema de colores">🌙</button>
  </div>

  <a class="game-card" href="sudoku.html">
    <div class="game-thumb sudoku-thumb" aria-hidden="true">
      <span>5</span><span></span><span>3</span>
      <span></span><span class="a">7</span><span></span>
      <span>9</span><span></span><span class="a">1</span>
    </div>
    <div class="game-info">
      <div class="game-name">Sudoku</div>
      <div class="game-desc">Completa del 1 al 9 sin repetir en fila, columna ni caja.</div>
      <div class="game-progress" id="progress-sudoku"></div>
    </div>
    <div class="game-go">›</div>
  </a>

  <a class="game-card" href="queens.html">
    <div class="game-thumb queens-thumb" aria-hidden="true">
      <span style="background:var(--qz1)"></span><span style="background:var(--qz1)">♛</span><span style="background:var(--qz0)"></span><span style="background:var(--qz0)"></span>
      <span style="background:var(--qz2)"></span><span style="background:var(--qz1)"></span><span style="background:var(--qz0)"></span><span style="background:var(--qz0)">♛</span>
      <span style="background:var(--qz2)">♛</span><span style="background:var(--qz2)"></span><span style="background:var(--qz3)"></span><span style="background:var(--qz3)"></span>
      <span style="background:var(--qz2)"></span><span style="background:var(--qz3)"></span><span style="background:var(--qz3)">♛</span><span style="background:var(--qz3)"></span>
    </div>
    <div class="game-info">
      <div class="game-name">Queens</div>
      <div class="game-desc">Una reina por fila, columna y color, sin que se toquen.</div>
      <div class="game-progress" id="progress-queens"></div>
    </div>
    <div class="game-go">›</div>
  </a>

</div>

<script src="theme.js"></script>
<script>
  Theme.bind(document.getElementById('btn-theme'));

  // Muestra en cada tarjeta si hay una partida a medias.
  (function () {
    function fmt(total) {
      var m = Math.floor(total / 60), s = total % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }
    function read(key) {
      try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; }
    }
    var labels = { easy: 'Fácil', medium: 'Medio', hard: 'Difícil', expert: 'Experto' };
    var s = read('sudoku_game_v1');
    if (s && !s.solved && s.elapsed > 0) {
      document.getElementById('progress-sudoku').textContent =
        '▶ Partida en curso · ' + (labels[s.difficulty] || '') + ' · ' + fmt(s.elapsed);
    }
    var q = read('queens_game_v1');
    if (q && !q.solved && q.elapsed > 0) {
      document.getElementById('progress-queens').textContent =
        '▶ Partida en curso · ' + q.n + '×' + q.n + ' · ' + fmt(q.elapsed);
    }
  })();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
