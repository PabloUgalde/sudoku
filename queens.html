<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Queens</title>
<meta name="theme-color" content="#14161a" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-title" content="Juegos" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<script>
  (function () {
    try {
      var t = localStorage.getItem('sudoku_theme_v1');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <div class="toolbar">
    <select id="size" title="Tamaño del tablero">
      <option value="5">5×5</option>
      <option value="6">6×6</option>
      <option value="7" selected>7×7</option>
      <option value="8">8×8</option>
      <option value="9">9×9</option>
    </select>
    <button class="btn" id="btn-new">Nueva partida</button>
    <button class="icon-btn" id="btn-undo" title="Deshacer">↺</button>
    <button class="icon-btn" id="btn-redo" title="Rehacer">↻</button>
    <button class="icon-btn" id="btn-check" title="Comprobar las reinas y ✕ puestas">✓</button>
    <button class="icon-btn" id="btn-autox" title="Autocompletar ✕: marca todas las celdas donde ya no cabe una reina">✨</button>
  </div>

  <div class="statusbar">
    <a class="icon-btn back-btn" href="index.html" title="Volver a los juegos">←</a>
    <div class="timer" id="timer">00:00</div>
    <button class="icon-btn" id="btn-pause" title="Pausar">⏸</button>
    <button class="icon-btn" id="btn-theme" title="Cambiar esquema de colores">🌙</button>
  </div>

  <div class="q-warn" id="warn"></div>

  <div class="board-wrap q-wrap">
    <div class="q-board" id="board"></div>
    <div class="pause-overlay" id="pause-overlay">
      <button class="btn" id="btn-resume">▶ Reanudar</button>
    </div>
    <div class="win-overlay hidden" id="win-overlay">
      <div class="win-card">
        <div class="win-icon">🏆</div>
        <h2>¡Resuelto!</h2>
        <div class="win-stats">
          <span class="win-chip" id="win-size"></span>
          <span class="win-chip" id="win-time"></span>
        </div>
        <button class="btn win-btn" id="btn-win-new">Nueva partida</button>
      </div>
    </div>
  </div>

  <div class="numpad q-tools" id="tools">
    <button class="num-btn" data-tool="x" title="Marcar ✕: toca o arrastra por las celdas (X)">✕</button>
    <button class="num-btn" data-tool="queen" title="Poner reina (Q)">♛</button>
    <button class="num-btn erase" data-tool="erase" title="Borrar: toca o arrastra por las celdas">⌫</button>
    <button class="num-btn tool-btn" id="btn-hint" title="Pista: corrige una reina mal puesta o revela una correcta">💡</button>
    <button class="num-btn tool-btn" id="btn-clear-x" title="Quitar todas las ✕">🧹</button>
  </div>

  <p class="hint">
    Una ♛ por fila, columna y color, sin tocarse (ni en diagonal).
    <strong>Toque:</strong> 1 = ✕, 2 = ♛, 3 = borrar. O elige ✕ / ♛ / ⌫ abajo y toca o arrastra.
  </p>

</div>

<script src="theme.js"></script>
<script src="queens.js"></script>
<script src="queens-app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
